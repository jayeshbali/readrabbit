<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadRabbit - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 24px;
      color: #374151;
      margin-bottom: 8px;
    }
    
    p {
      color: #6b7280;
      margin-bottom: 24px;
    }
    
    button {
      background: #f97316;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    
    button:hover {
      background: #ea580c;
    }
  </style>
</head>
<body>
  <div class="icon">🐰</div>
  <h1>You're Offline</h1>
  <p>ReadRabbit needs an internet connection to load your articles.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
