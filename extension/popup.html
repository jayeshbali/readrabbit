<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
    }
    
    .header {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .header-icon {
      font-size: 24px;
    }
    
    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .header-text p {
      font-size: 11px;
      opacity: 0.9;
    }
    
    .content {
      padding: 16px;
    }
    
    .url-preview {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    
    .url-preview-label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .url-preview-text {
      font-size: 13px;
      color: #374151;
      word-break: break-all;
      line-height: 1.4;
    }
    
    .save-btn {
      width: 100%;
      background: #f97316;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    
    .save-btn:hover {
      background: #ea580c;
    }
    
    .save-btn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }
    
    .save-btn.success {
      background: #22c55e;
    }
    
    .save-btn.error {
      background: #ef4444;
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    
    .message.show {
      display: block;
    }
    
    .message.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    
    .article-info {
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      display: none;
    }
    
    .article-info.show {
      display: block;
    }
    
    .article-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    
    .article-meta {
      font-size: 11px;
      color: #6b7280;
    }
    
    .article-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    
    .topic-tag {
      font-size: 10px;
      background: #e5e7eb;
      color: #4b5563;
      padding: 2px 8px;
      border-radius: 10px;
    }
    
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }
    
    .footer a {
      font-size: 11px;
      color: #f97316;
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    .not-article {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }
    
    .not-article-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    
    .not-article p {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🐰</span>
    <div class="header-text">
      <h1>ReadRabbit</h1>
      <p>Save to your reading list</p>
    </div>
  </div>
  
  <div class="content" id="main-content">
    <div class="url-preview">
      <div class="url-preview-label">Current Page</div>
      <div class="url-preview-text" id="url-display">Loading...</div>
    </div>
    
    <button class="save-btn" id="save-btn">
      <span id="btn-icon">📥</span>
      <span id="btn-text">Save Article</span>
    </button>
    
    <div class="message" id="message"></div>
    
    <div class="article-info" id="article-info">
      <div class="article-title" id="article-title"></div>
      <div class="article-meta" id="article-meta"></div>
      <div class="article-topics" id="article-topics"></div>
    </div>
  </div>
  
  <div class="not-article" id="not-article" style="display: none;">
    <div class="not-article-icon">🚫</div>
    <p>This doesn't look like an article.<br>Navigate to an article page to save it.</p>
  </div>
  
  <div class="footer">
    <a href="https://readrabbit-three.vercel.app" target="_blank">Open ReadRabbit →</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
